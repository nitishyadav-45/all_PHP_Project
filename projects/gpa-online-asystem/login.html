<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Dashboard | Interactive</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --primary-color: #4e73df;
            --sidebar-bg: #2c3e50;
        }

        body {
            background-color: #f8f9fc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
        }

        /* Sidebar Styling */
        .sidebar {
            min-height: 100vh;
            background: var(--sidebar-bg);
            color: white;
            transition: all 0.3s;
        }

        .nav-link {
            color: rgba(255,255,255,0.8);
            margin: 10px 0;
            transition: 0.3s;
        }

        .nav-link:hover {
            color: white;
            background: rgba(255,255,255,0.1);
            border-radius: 5px;
        }

        /* Dashboard Cards */
        .stat-card {
            border: none;
            border-left: 4px solid var(--primary-color);
            transition: transform 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        /* Greeting Button */
        .wish-btn {
            background: linear-gradient(45deg, #ff006e, #8338ec);
            border: none;
            color: white;
            padding: 10px 25px;
            border-radius: 50px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .wish-btn:hover {
            filter: brightness(1.1);
        }

        .welcome-section {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
            margin-bottom: 30px;
        }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <nav class="col-md-2 d-none d-md-block sidebar p-3 shadow">
            <h4 class="text-center mb-4"><i class="fas fa-chalkboard-teacher me-2"></i>EduPortal</h4>
            <ul class="nav flex-column">
                <li class="nav-item"><a class="nav-link active" href="#"><i class="fas fa-home me-2"></i> Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" href="#"><i class="fas fa-user-graduate me-2"></i> Students</a></li>
                <li class="nav-item"><a class="nav-link" href="#"><i class="fas fa-book me-2"></i> Courses</a></li>
                <li class="nav-item"><a class="nav-link" href="#"><i class="fas fa-calendar-alt me-2"></i> Attendance</a></li>
                <li class="nav-item"><a class="nav-link" href="#"><i class="fas fa-cog me-2"></i> Settings</a></li>
            </ul>
        </nav>

        <main class="col-md-10 ms-sm-auto px-md-4 py-4">
            
            <div class="welcome-section animate__animated animate__fadeInDown">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h1 id="greeting-text" class="fw-bold text-dark">Hello Teacher!</h1>
                        <p class="text-muted">Welcome back to your workspace. Here is what's happening today.</p>
                    </div>
                    <button class="wish-btn animate__animated animate__pulse animate__infinite" onclick="triggerGreeting()">
                        <i class="fas fa-magic me-2"></i> Wish Me Again
                    </button>
                </div>
            </div>

            <div class="row g-4">
                <div class="col-md-3">
                    <div class="card stat-card p-3 shadow-sm animate__animated animate__fadeInUp" style="animation-delay: 0.1s;">
                        <div class="d-flex align-items-center">
                            <div class="flex-grow-1">
                                <small class="text-uppercase fw-bold text-primary">Total Students</small>
                                <h3 class="mb-0">1,250</h3>
                            </div>
                            <i class="fas fa-users fa-2x text-gray-300 opacity-25"></i>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card stat-card p-3 shadow-sm animate__animated animate__fadeInUp" style="animation-delay: 0.2s; border-left-color: #1cc88a;">
                        <div class="d-flex align-items-center">
                            <div class="flex-grow-1">
                                <small class="text-uppercase fw-bold text-success">Attendance</small>
                                <h3 class="mb-0">94%</h3>
                            </div>
                            <i class="fas fa-clipboard-check fa-2x text-gray-300 opacity-25"></i>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card stat-card p-3 shadow-sm animate__animated animate__fadeInUp" style="animation-delay: 0.3s; border-left-color: #36b9cc;">
                        <div class="d-flex align-items-center">
                            <div class="flex-grow-1">
                                <small class="text-uppercase fw-bold text-info">Active Courses</small>
                                <h3 class="mb-0">12</h3>
                            </div>
                            <i class="fas fa-layer-group fa-2x text-gray-300 opacity-25"></i>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card stat-card p-3 shadow-sm animate__animated animate__fadeInUp" style="animation-delay: 0.4s; border-left-color: #f6c23e;">
                        <div class="d-flex align-items-center">
                            <div class="flex-grow-1">
                                <small class="text-uppercase fw-bold text-warning">Pending Tasks</small>
                                <h3 class="mb-0">05</h3>
                            </div>
                            <i class="fas fa-tasks fa-2x text-gray-300 opacity-25"></i>
                        </div>
                    </div>
                </div>
            </div>

        </main>
    </div>
</div>

<script>
    // 1. Time-based Greeting Function
    function getWishText() {
        const hour = new Date().getHours();
        if (hour < 12) return "Good Morning, Teacher!";
        if (hour < 17) return "Good Afternoon, Teacher!";
        return "Good Evening, Teacher!";
    }

    // 2. Colorful Fountain Effect (Confetti)
    function launchFountain() {
        var duration = 3 * 1000;
        var animationEnd = Date.now() + duration;
        var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };

        function randomInRange(min, max) {
            return Math.random() * (max - min) + min;
        }

        var interval = setInterval(function() {
            var timeLeft = animationEnd - Date.now();

            if (timeLeft <= 0) {
                return clearInterval(interval);
            }

            var particleCount = 50 * (timeLeft / duration);
            confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
            confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
        }, 250);
    }

    // 3. Voice & Visual Trigger
    function triggerGreeting() {
        const message = getWishText();
        document.getElementById('greeting-text').innerText = message;

        // Visual Fountain
        launchFountain();

        // Speech Synthesis
        const speech = new SpeechSynthesisUtterance();
        speech.text = message;
        speech.volume = 1;
        speech.rate = 1;
        speech.pitch = 1;
        window.speechSynthesis.speak(speech);
    }

    // 4. Auto Trigger on Page Load
    // Note: Modern browsers block sound on load. User interaction is needed.
    // This script tries to run on load, but if blocked, the button will work.
    window.onload = () => {
        setTimeout(() => {
            triggerGreeting();
        }, 800);
    };
</script>

</body>
</html>
