<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student ID Card</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Roboto:wght@400;700&family=Libre+Barcode+39+Text&display=swap" rel="stylesheet">
    
    <style>
        /* Base Settings to ensure printing with colors */
        @media print {
            body {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
                background-color: white !important;
            }
            .id-card-container {
                box-shadow: none !important;
                margin: 0 auto !important;
                page-break-inside: avoid;
            }
            /* Hide unnecessary UI elements during print if needed */
            .print-btn { 
                display: none !important; 
                width: 100px;
            
            }
        }

        body {
            background-color: #f4f6f9;
            font-family: 'Roboto', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .id-card-container {
            width: 100%;
            max-width: 800px;
            background: linear-gradient(135deg, #fdfdfd 0%, #ebf4fa 100%);
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            border: 1px solid #ddd;
        }

        /* Abstract Shapes Background */
        .shape-top-left {
            position: absolute;
            top: 0;
            left: 0;
            width: 200px;
            height: 200px;
            background: #00b4d8;
            clip-path: polygon(0 0, 100% 0, 0 100%);
            z-index: 1;
        }
        .shape-top-left-dark {
            position: absolute;
            top: 40px;
            left: 0;
            width: 150px;
            height: 150px;
            background: #233261;
            clip-path: polygon(0 0, 100% 0, 0 100%);
            z-index: 2;
        }
        .shape-top-right {
            position: absolute;
            top: 0;
            right: 0;
            width: 150px;
            height: 100px;
            background: #2b78c5;
            border-bottom-left-radius: 50px;
            border-bottom-right-radius: 50px;
            transform: translateX(30px) translateY(-20px);
        }

        /* Header Section */
        .card-header-section {
            position: relative;
            padding: 30px 20px 20px 150px; /* Space for logo */
            z-index: 3;
        }

        .logo-shield {
            position: absolute;
            top: 0;
            left: 100px;
            width: 90px;
            height: 120px;
            background-color: #233261;
            clip-path: polygon(0 0, 100% 0, 100% 75%, 50% 100%, 0 75%);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 2.5rem;
            z-index: 4;
        }

        .university-name {
            font-family: 'Playfair Display', serif;
            color: #233261;
            font-size: 2.5rem;
            margin-bottom: 0;
            line-height: 1.1;
        }
        
        .university-address {
            color: #333;
            font-size: 1.1rem;
            margin-top: 5px;
        }

        /* Main Body Section */
        .photo-section {
            background-color: #233261;
            padding: 20px;
            height: 100%;
        }
        
        .photo-section img {
            width: 100%;
            height: 350px;
            object-fit: cover;
            border: 2px solid #233261;
            background-color: white;
        }

        .student-card-title {
            background-color: #2b78c5;
            color: white;
            padding: 12px 40px;
            font-size: 1.8rem;
            font-weight: 700;
            border-radius: 0 30px 30px 0;
            display: inline-block;
            margin-left: -15px; /* Pulls slightly over the photo section */
            margin-top: 20px;
            margin-bottom: 40px;
        }

        /* Details Table */
        .details-table {
            width: 100%;
            font-size: 1.2rem;
            color: #233261;
            margin-left: 10px;
        }
        .details-table td {
            padding: 10px 5px;
            vertical-align: top;
        }
        .details-table .label {
            width: 100px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }
        .details-table .colon {
            width: 20px;
            font-weight: bold;
        }
        .details-table .value {
            font-weight: 700;
        }

        /* Barcode */
        .barcode-section {
            text-align: right;
            margin-top: 30px;
            padding-right: 20px;
            padding-bottom: 20px;
        }
        .barcode-font {
            font-family: 'Libre Barcode 39 Text', cursive;
            font-size: 3rem;
            color: #233261;
            line-height: 0.8;
            display: inline-block;
        }
        
        /* Utility */
        .text-navy { color: #233261 !important; }
    </style>
</head>
<body>

    <button class="btn btn-primary print-btn position-absolute top-0 end-0 m-3" onclick="window.print()">
        <i class="fas fa-print me-2"></i> Print Card
    </button>

    <div class="id-card-container">
        <div class="shape-top-left"></div>
        <div class="shape-top-left-dark"></div>
        <div class="shape-top-right"></div>

        <div class="card-header-section">
            <div class="logo-shield">
                <i class="fas fa-graduation-cap"></i>
            </div>
            <div style="padding-left: 60px;">
                <h1 class="university-name">RIMBERIO UNIVERSITY</h1>
                <p class="university-address">123 Anywhere St., Any City, ST 12345</p>
            </div>
        </div>

        <div class="row g-0">
            <div class="col-md-5 col-5">
                <div class="photo-section">
                    <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" alt="Student Photo">
                </div>
            </div>

            <div class="col-md-7 col-7 position-relative">
                <div class="student-card-title">
                    STUDENT CARD
                </div>

                <div class="px-3">
                    <table class="details-table">
                        <tr>
                            <td class="label">NAME</td>
                            <td class="colon">:</td>
                            <td class="value">OLIVIA WILSON</td>
                        </tr>
                        <tr>
                            <td class="label">BIRTH</td>
                            <td class="colon">:</td>
                            <td class="value">13/09/1997</td>
                        </tr>
                        <tr>
                            <td class="label">ADDRESS</td>
                            <td class="colon">:</td>
                            <td class="value">123 ANYWHERE ST., ANY CITY</td>
                        </tr>
                        <tr>
                            <td class="label">ID NO</td>
                            <td class="colon">:</td>
                            <td class="value">123-456-7890</td>
                        </tr>
                    </table>
                </div>

                <div class="barcode-section">
                    <div class="barcode-font">
                        *1234567890*
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
